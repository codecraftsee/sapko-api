# Local development only. Live services are switched off so that local runs
# cannot send real email or write to Supabase, whatever .env contains.
services:
  api:
    build: .
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "${API_PORT:-8001}:8000"
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: sqlite:////data/sapko.db
      UPLOAD_DIR: /data/uploads
      FRONTEND_URL: http://localhost:4200
      RESEND_API_KEY: ""
      SUPABASE_URL: ""
      SUPABASE_KEY: ""
      WATCHFILES_FORCE_POLLING: "true"
    volumes:
      - ./app:/srv/sapko/app:ro
      - sapko-data:/data

volumes:
  sapko-data:
